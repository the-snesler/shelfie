name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # Typecheck, build, and test the whole workspace. Gates every PR.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          # pnpm 11.5.2 requires Node >= 22.13; the Docker runtime uses Node 24.
          node-version: 24
          cache: pnpm

      # Skip the Puppeteer Chromium download — the feed source isn't exercised
      # in CI and the binary is only needed in the Docker runtime image.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # Build the Docker image on every PR (no push); publish to GHCR only on main.
  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (PRs)
        if: github.event_name == 'pull_request'
        run: docker build -t shelfie:ci .

      - name: Build and publish a Docker image for ${{ github.repository }}
        if: github.event_name == 'push'
        uses: macbre/push-to-ghcr@v14
        with:
          image_name: ${{ github.repository }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
