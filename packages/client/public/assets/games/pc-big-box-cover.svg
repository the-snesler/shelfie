<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1000" preserveAspectRatio="none">
  <!-- Mockup overlay: placeholder art, replace with a final PNG at this aspect ratio (0.82, cardboard big box, up to ~2001). No platform band: the art is the whole front. -->
  <defs>
    <linearGradient id="top" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="right" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <!-- folded cardboard edges catching light from the top-left -->
  <rect x="0" y="0" width="820" height="14" fill="url(#top)"/>
  <rect x="0" y="986" width="820" height="14" fill="url(#bottom)"/>
  <rect x="806" y="0" width="14" height="1000" fill="url(#right)"/>
  <rect x="2" y="2" width="816" height="996" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="4"/>
  <!-- corner platform badge -->
  <rect x="28" y="902" width="96" height="62" rx="6" fill="#111" fill-opacity="0.85"/>
  <text x="76" y="946" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#fff">PC</text>
</svg>
